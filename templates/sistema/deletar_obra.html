<!DOCTYPE html>
<html lang="pt-br" class="bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Obra - {{ obra.titulo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-8 text-center">
        
        <!-- Ícone de Alerta -->
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-600/20 mb-6 border border-red-500/30">
            <svg class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <!-- Mensagem de Confirmação -->
        <h1 class="text-2xl font-bold text-slate-100 mb-2">Eliminar Obra</h1>
        <p class="text-slate-400 mb-8">
            Tem a certeza que deseja eliminar a obra <br>
            <strong class="text-red-400 text-lg">"{{ obra.titulo }}"</strong>?<br>
            <span class="text-sm mt-2 block opacity-75">Esta ação é irreversível e os dados serão perdidos.</span>
        </p>

        <!-- Formulário de Ação -->
        <form method="POST" class="flex items-center justify-center space-x-4">
            {% csrf_token %}
            
            <a href="{% url 'catalogo' %}" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-6 py-2.5 rounded-lg border border-slate-700 transition-all duration-200">
                Cancelar
            </a>
            
            <button type="submit" class="bg-red-600 hover:bg-red-500 active:scale-95 text-white font-semibold px-6 py-2.5 rounded-lg shadow-lg shadow-red-600/20 transition-all duration-200">
                Sim, Eliminar
            </button>
        </form>

    </div>

</body>
</html>
